
name: CloudFile CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CloudFile erstellen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Code prüfen
        run: npm run lint

      - name: CloudFile bauen
        run: npm run build

      - name: Build-Dateien speichern
        uses: actions/upload-artifact@v4
        with:
          name: cloudfile-build
          path: dist/
          if-no-files-found: error
